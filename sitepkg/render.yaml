services:
  - type: web
    name: our-abkhazia-trip
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: our-abkhazia-db
          property: connectionString

databases:
  - name: our-abkhazia-db
    plan: free
    region: frankfurt
